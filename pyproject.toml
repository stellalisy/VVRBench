[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vvr-bench"
version = "1.4.2"
description = "Programmatically verifiable visual instruction-following benchmark and RLVVR training code"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.25",
  "numpy>=1.24",
  "pillow>=10",
  "pyarrow>=15",
]

[project.optional-dependencies]
# Versions of the environment that trained the paper's models.
train = [
  "torch>=2.6",
  "accelerate==1.4.0",
  "diffusers==0.33.1",
  "transformers==4.45.2",
  "peft==0.10.0",
  "numpy==1.26.4",
  "scipy==1.15.2",
  "ml_collections",
  "absl-py",
  "sentencepiece",
  "protobuf==3.20.3",
  "requests",
  "openai",
  "wandb",
  "tqdm",
]
ocr = [
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
  "python-Levenshtein",
]

[project.scripts]
vvr-bench-evaluate = "vvr_bench.evaluate:main"

[tool.setuptools]
packages = ["vvr_bench", "rlvvr", "rlvvr.diffusers_patch"]
