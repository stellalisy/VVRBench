[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vvr-bench"
version = "1.4.2"
description = "Programmatically verifiable visual instruction-following benchmark"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.25",
  "numpy>=1.24",
  "pillow>=10",
  "pyarrow>=15",
]

[project.scripts]
vvr-bench-evaluate = "vvr_bench.evaluate:main"

[tool.setuptools]
packages = ["vvr_bench"]
